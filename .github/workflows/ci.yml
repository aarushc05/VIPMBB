name: Synthetic regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Docker Compose
        run: docker compose version
      - name: Test launchers, frontend, and isolated PostgreSQL backend
        run: npm test
      - name: Clean up the synthetic test stack
        if: always()
        run: docker compose -f infra/compose.test.yaml down
